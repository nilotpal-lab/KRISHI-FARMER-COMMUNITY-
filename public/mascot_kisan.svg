<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="turbanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="40%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#D35400"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0AC69"/>
      <stop offset="100%" stop-color="#C68642"/>
    </linearGradient>
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5134"/>
      <stop offset="100%" stop-color="#143A24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Circle (Warm Mint Ground) -->
  <circle cx="64" cy="64" r="62" fill="#E9EFE8" stroke="#1F5134" stroke-width="2.5"/>

  <!-- Body / Kurta & Nehru Vest -->
  <path d="M22 122 C22 96 42 90 64 90 C86 90 106 96 106 122 Z" fill="#F7F6F0" filter="url(#shadow)"/>
  <!-- Green Farmer Vest -->
  <path d="M30 122 C30 98 44 92 54 94 L54 122 Z" fill="url(#vestGrad)"/>
  <path d="M98 122 C98 98 84 92 74 94 L74 122 Z" fill="url(#vestGrad)"/>

  <!-- Neck -->
  <rect x="55" y="76" width="18" height="18" rx="4" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="36" cy="66" rx="5" ry="7" fill="url(#skinGrad)"/>
  <ellipse cx="92" cy="66" rx="5" ry="7" fill="url(#skinGrad)"/>
  <!-- Traditional Gold Earring -->
  <circle cx="36" cy="72" r="2.2" fill="#F1C40F" stroke="#B7950B" stroke-width="0.6"/>

  <!-- Head / Face -->
  <ellipse cx="64" cy="64" rx="27" ry="26" fill="url(#skinGrad)" filter="url(#shadow)"/>

  <!-- Turban (Traditional Indian Pagri / Peta) -->
  <path d="M34 52 C32 30 50 18 64 18 C80 18 96 28 94 52 C94 52 86 38 64 38 C42 38 34 52 34 52 Z" fill="url(#turbanGrad)"/>
  <!-- Turban Swirl Layers -->
  <path d="M32 46 C36 32 54 26 68 26 C82 26 96 34 96 46 C92 40 76 36 64 36 C48 36 36 42 32 46 Z" fill="#F39C12"/>
  <path d="M34 40 C42 22 62 20 74 24 C62 20 46 26 34 40 Z" fill="#E67E22"/>
  <!-- Turban Fold / Pleat -->
  <path d="M60 18 C64 12 70 14 72 20 C68 24 64 22 60 18 Z" fill="#D35400"/>
  <!-- Golden Brooch / Crop Crest on Turban -->
  <circle cx="64" cy="30" r="5" fill="#F1C40F" stroke="#B7950B" stroke-width="1"/>
  <!-- Little Wheat Leaf Motif on Brooch -->
  <path d="M64 27 C63 29 63 32 64 33 C65 32 65 29 64 27 Z" fill="#1F5134"/>

  <!-- Eyebrows -->
  <path d="M46 54 C50 51 55 52 58 55" stroke="#2C1D11" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M82 54 C78 51 73 52 70 55" stroke="#2C1D11" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Warm Eyes with Highlights -->
  <ellipse cx="51" cy="60" rx="3.5" ry="3" fill="#2C1D11"/>
  <circle cx="50" cy="59" r="1.2" fill="#FFFFFF"/>
  <ellipse cx="77" cy="60" rx="3.5" ry="3" fill="#2C1D11"/>
  <circle cx="76" cy="59" r="1.2" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M64 58 L63 67 C61 68 67 68 65 67 Z" fill="#B37433"/>

  <!-- Dignified Farmer Mustache -->
  <path d="M64 71 C58 68 46 72 42 77 C48 77 58 74 64 73 C70 74 80 77 86 77 C82 72 70 68 64 71 Z" fill="#2C1D11"/>

  <!-- Warm Smile -->
  <path d="M56 77 C59 81 69 81 72 77" stroke="#8A4B1A" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Tilak / Auspicious Chandan Mark -->
  <path d="M64 44 L64 51" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="64" cy="52" r="1.2" fill="#F1C40F"/>

  <!-- Golden Crop Twig in Hand or Badge -->
  <g transform="translate(86, 92) scale(0.7)">
    <circle cx="16" cy="16" r="15" fill="#1F5134" stroke="#F1C40F" stroke-width="1.8"/>
    <!-- Wheat Ears -->
    <path d="M16 6 L16 26 M16 10 L12 8 M16 10 L20 8 M16 14 L11 12 M16 14 L21 12 M16 18 L12 16 M16 18 L20 16" stroke="#F1C40F" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
